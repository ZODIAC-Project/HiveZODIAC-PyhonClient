<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoC Dashboard</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; padding: 10px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ddd; padding: 8px; }
      th { background: #f3f3f3; }
      #logs { height: 200px; overflow: auto; background: #fffaf0; border: 1px solid #ddd; padding: 8px; }
      #controls { margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <h1>PoC Dashboard</h1>
    <div id="controls">
      <h3>New Reservation</h3>
      <form id="resForm">
        Topic: <input id="topic" size=30 /> <br/>
        PIP (comma separated): <input id="pip" /> <br/>
        AIP (comma separated): <input id="aip" /> <br/>
        <button id="addRes">Create</button>
      </form>
      <h4>Settings</h4>
      <label><input type="checkbox" id="allowRes" /> allow without reservation</label>
    </div>

    <h2>Reservations</h2>
    <table id="resTable">
      <thead><tr><th>Topic</th><th>PIP</th><th>AIP</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2>Event Log</h2>
    <div id="logs"></div>

    <script>
      const apiBase = '/api'
      async function loadReservations(){
        const res = await fetch(apiBase + '/reservations')
        const data = await res.json()
        const tbody = document.querySelector('#resTable tbody')
        tbody.innerHTML = ''
        data.forEach(r => {
          const row = document.createElement('tr')
          row.innerHTML = `<td>${r.topic}</td><td>${(r.pip||[]).join(',')}</td><td>${(r.aip||[]).join(',')}</td><td><button data-topic='${r.topic}' class='del'>Delete</button></td>`
          tbody.appendChild(row)
        })
        document.querySelectorAll('.del').forEach(btn =>{
          btn.onclick = async (e) =>{
            const topic = btn.getAttribute('data-topic')
            await fetch(apiBase + '/reservations?topic='+encodeURIComponent(topic), { method: 'DELETE'})
            loadReservations()
          }
        })
      }

      function appendLog(msg){
        const d = document.createElement('div')
        d.textContent = `[${new Date().toLocaleTimeString()}] ${JSON.stringify(msg)}`
        const logs = document.getElementById('logs')
        logs.prepend(d)
      }

      async function init(){
        await loadReservations()
        // load settings
        const s = await (await fetch(apiBase + '/settings')).json()
        document.getElementById('allowRes').checked = s.allow_without_reservation

        // wire form
        document.getElementById('resForm').onsubmit = async (e)=>{
          e.preventDefault()
          const topic = document.getElementById('topic').value
          const pip = document.getElementById('pip').value.split(',').map(x=>x.trim()).filter(x=>x)
          const aip = document.getElementById('aip').value.split(',').map(x=>x.trim()).filter(x=>x)
          await fetch(apiBase + '/reservations', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({topic, pip, aip})})
          loadReservations()
        }

        document.getElementById('allowRes').addEventListener('change', async (e)=>{
          const val = e.target.checked
          await fetch(apiBase + '/settings', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({allow_without_reservation: val})})
        })

        // websocket for live updates
        // prefer WebSocket if available, otherwise fallback to short-polling
        const proto = location.protocol === 'https:' ? 'wss' : 'ws'
        const wsUrl = `${proto}://${location.host}/ws`
        let wsSupport = true
        try {
          var ws = new WebSocket(wsUrl)
        } catch(e) {
          wsSupport = false
        }
        if(wsSupport){
          ws.onopen = () => { appendLog('ws open'); ws.send('state') }
          ws.onmessage = (e) => { const j = JSON.parse(e.data); appendLog(j) ; if(j.type === 'reservation' || j.type === 'reservation-removed' || j.type === 'reservation-cleared') loadReservations(); }
          ws.onclose = () => { appendLog('ws closed'); startPolling() }
          ws.onerror = (e) => { appendLog('ws error'); startPolling() }
        } else {
          appendLog('WebSocket not available, using polling fallback');
          startPolling()
        }

        function startPolling(){
          appendLog('start polling logs every 3s')
          setInterval(async ()=>{
            try {
              const logs = await (await fetch(apiBase + '/logs')).json()
              logs.slice(-20).forEach(l => appendLog(l))
            } catch(e){ console.error(e) }
          }, 3000)
        }
      }
      init()
    </script>
  </body>
</html>
