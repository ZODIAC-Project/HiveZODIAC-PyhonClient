apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kiali-servicemonitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kiali
  namespaceSelector:
    matchNames:
      - istio-system
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scheme: http
