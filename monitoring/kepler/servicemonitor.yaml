apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kepler-servicemonitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scheme: http

# Notes:
# - This ServiceMonitor expects the Kepler Service to have label
#   `app.kubernetes.io/name=kepler` and expose a port named `http` (9102).
# - If you install Kepler via Helm, the chart may create its own
#   ServiceMonitor depending on values. Use this file as a fallback

